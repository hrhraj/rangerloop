app = "rangerloop-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "node server/dist/index.js"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  processes = ["app"]
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
